<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>OgaMarket | Online Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandGreen: '#085A36', brandGreenDark: '#053E25', brandGold: '#F2A900', brandRed: '#D9381E', surfaceBg: '#F0F4F2' },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], body: ['"Inter"', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    input, select, textarea, button { font-size: 16px !important; }
    .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 32px 0 rgba(8, 90, 54, 0.1); }
    .glass-card { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 4px 24px -5px rgba(8, 90, 54, 0.08); transition: transform 0.2s; }
    .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.9); }
    .bg-blob-1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(8,90,54,0.15) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; z-index: -1; pointer-events: none; }
    @keyframes badgePop { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .badge-pop { animation: badgePop 0.25s ease-in-out; }
  </style>
</head>
<body class="bg-surfaceBg text-slate-800 antialiased font-sans relative overflow-x-hidden min-h-screen pb-24 sm:pb-0">
  <div class="bg-blob-1"></div>

  <header class="sticky top-0 z-40 glass-nav shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 sm:gap-3 cursor-pointer">
        <svg class="w-8 h-8 sm:w-10 sm:h-10 flex-shrink-0 pointer-events-none" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="56" r="32" stroke="#085A36" stroke-width="12"></circle>
          <circle cx="50" cy="56" r="32" stroke="#F2A900" stroke-width="12" stroke-dasharray="10 6"></circle>
          <path d="M40 32C40 26 44 22 50 22C56 22 60 26 60 32" stroke="#085A36" stroke-width="4" stroke-linecap="round"></path>
          <path d="M28 26L36 12L50 20L64 12L72 26H28Z" fill="#085A36"></path>
        </svg>
        <span class="text-xl sm:text-2xl font-extrabold text-brandGreen leading-none pointer-events-none">Oga<span class="text-brandGold">Market</span></span>
      </a>
      <div class="flex items-center gap-3">
        <a href="track.html" class="hidden sm:inline-flex text-xs font-semibold text-slate-500 hover:text-slate-800 px-3 py-2.5 rounded-xl hover:bg-slate-100 cursor-pointer">Track Order</a>
        <button id="cartBtnTop" type="button" onclick="openCart()" class="bg-brandGreen text-white px-4 py-2 rounded-xl font-bold text-sm shadow-sm flex items-center gap-2 cursor-pointer active:scale-95 transition-transform">
          <span class="hidden sm:inline">Bag</span>
          <svg class="w-4 h-4 sm:hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
          <span id="cartCountBadge" class="bg-brandGold text-slate-900 text-xs px-2 py-0.5 rounded-full font-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="sm:hidden fixed bottom-0 left-0 w-full glass-nav z-[50] flex items-center justify-around px-2 h-16 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
    <a href="index.html" class="flex flex-col items-center justify-center flex-1 h-full text-slate-500 hover:text-brandGreen cursor-pointer active:scale-95 transition-transform">
      <svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold mt-1 pointer-events-none">Home</span>
    </a>
    <a href="store.html" class="flex flex-col items-center justify-center flex-1 h-full text-brandGreen cursor-pointer active:scale-95 transition-transform">
      <svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
      <span class="text-[10px] font-bold mt-1 pointer-events-none">Store</span>
    </a>
    <a href="track.html" class="flex flex-col items-center justify-center flex-1 h-full text-slate-500 hover:text-brandGreen cursor-pointer active:scale-95 transition-transform">
      <svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 001 1h1m0-1h2a1 1 0 001-1v-4l-3-4h-3v8zm0-8h.01"></path></svg>
      <span class="text-[10px] font-bold mt-1 pointer-events-none">Track</span>
    </a>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-6 pb-10 flex-grow w-full">
    <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar">
      <button type="button" onclick="filterCategory('ALL')" id="tab-ALL" class="category-tab px-4 py-2 rounded-xl text-xs font-bold bg-brandGreen text-white whitespace-nowrap cursor-pointer active:scale-95">All</button>
      <button type="button" onclick="filterCategory('SWALLOWS')" id="tab-SWALLOWS" class="category-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 whitespace-nowrap cursor-pointer active:scale-95">Grains & Tubers</button>
      <button type="button" onclick="filterCategory('SOUPS')" id="tab-SOUPS" class="category-tab px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 whitespace-nowrap cursor-pointer active:scale-95">Soups & Spices</button>
    </div>
    
    <div id="loader" class="text-center py-12 text-slate-400 font-bold">Loading live market inventory...</div>
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6"></div>
  </main>

  <!-- LEAD CAPTURE (DISCOUNT) MODAL -->
  <div id="discountModal" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-sm w-full p-8 text-center shadow-2xl relative">
      <button type="button" onclick="skipDiscount()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-900 font-bold text-2xl cursor-pointer leading-none">&times;</button>
      <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="text-3xl">🎁</span>
      </div>
      <h3 class="text-2xl font-extrabold mb-2 text-slate-900">Get ₦500 Off!</h3>
      <p class="text-sm text-slate-600 mb-6">Enter your details to unlock your first-timer market discount code.</p>
      <form id="discountForm" onsubmit="handleDiscountSubmit(event)" class="space-y-4">
        <input type="text" id="leadName" required placeholder="First Name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-center"/>
        <input type="email" id="leadEmail" required placeholder="Email Address" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-center"/>
        <button type="submit" class="w-full bg-brandGreen text-white py-3.5 rounded-xl font-bold shadow-md cursor-pointer active:scale-95 transition mt-2 text-sm">Claim My Discount</button>
      </form>
      <button type="button" onclick="skipDiscount()" class="mt-4 text-xs font-bold text-slate-400 hover:text-slate-700 cursor-pointer">No thanks, I'll pay full price</button>
    </div>
  </div>

  <!-- PRODUCT DETAILS MODAL -->
  <div id="detailsModal" class="fixed inset-0 z-[80] hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
    <div class="glass-panel rounded-3xl max-w-md w-full p-6 text-left my-8 shadow-2xl relative bg-white flex flex-col">
      <button type="button" onclick="closeDetails()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-900 font-bold text-2xl cursor-pointer leading-none z-10">&times;</button>
      <div id="detailsImages" class="flex overflow-x-auto snap-x snap-mandatory gap-2 no-scrollbar mb-4 -mx-2 px-2"></div>
      <h3 id="detailsName" class="text-xl font-extrabold text-slate-900 leading-tight mb-1"></h3>
      <p id="detailsGauge" class="text-xs text-slate-500 mb-2"></p>
      <p id="detailsPrice" class="text-lg font-extrabold font-mono text-brandGreen mb-4"></p>
      <p id="detailsDesc" class="text-sm text-slate-700 leading-relaxed mb-6 whitespace-pre-line"></p>
      <div id="detailsActionBtn" class="mt-auto"></div>
    </div>
  </div>

  <!-- CART SLIDE-OVER -->
  <div id="cartModal" class="fixed inset-0 z-[70] hidden">
    <div onclick="closeCart()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm cursor-pointer"></div>
    <div class="fixed inset-y-0 right-0 max-w-md w-full bg-white shadow-2xl flex flex-col z-10">
      <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="text-lg font-extrabold text-slate-900">Your Shopping Bag</h2>
        <button type="button" onclick="closeCart()" class="text-slate-400 hover:text-slate-700 font-bold p-2 text-2xl cursor-pointer leading-none">&times;</button>
      </div>
      <div id="cartItemsContainer" class="flex-grow overflow-y-auto p-5 space-y-3"></div>
      <div class="p-5 bg-slate-50 border-t border-slate-100">
        <div class="flex justify-between font-bold mb-4 text-base">
          <span>Subtotal:</span>
          <span id="cartSubtotalText" class="font-mono text-brandGreen font-extrabold text-lg">&#8358;0</span>
        </div>
        <button id="checkoutTriggerBtn" type="button" onclick="openCheckout()" class="w-full bg-brandGreen text-white py-4 rounded-xl font-bold shadow-md cursor-pointer active:scale-95 transition">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div id="checkoutModal" class="fixed inset-0 z-[90] hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
    <div class="glass-panel rounded-3xl max-w-lg w-full p-6 text-left my-8 shadow-2xl relative bg-white">
      <button type="button" onclick="closeCheckout()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-900 font-bold text-2xl cursor-pointer leading-none">&times;</button>
      <h3 class="text-xl font-extrabold mb-4 text-slate-900">Delivery Details</h3>
      <form id="checkoutForm" onsubmit="handleCheckout(event)" class="space-y-4">
        <input type="text" id="custName" required placeholder="Full Name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"/>
        <input type="email" id="custEmail" required placeholder="Email Address" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"/>
        <input type="tel" id="custWhatsApp" required placeholder="WhatsApp Number" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"/>
        <select id="custDestination" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-semibold text-sm">
          <option value="lagos">Lagos Doorstep Dispatch (&#8358;2,500)</option>
          <option value="interstate">Interstate Motor Park Waybill (&#8358;6,500)</option>
        </select>
        <textarea id="custAddress" required placeholder="Full Delivery Address" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm" rows="3"></textarea>
        <button id="submitOrderBtn" type="submit" class="w-full bg-brandGreen text-white py-4 rounded-xl font-bold shadow-md cursor-pointer active:scale-95 transition">Submit Order</button>
      </form>
    </div>
  </div>

  <!-- CUSTOM ALERTS -->
  <div id="customAlert" class="fixed inset-0 z-[120] hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl relative overflow-hidden">
      <div id="alertTopBar" class="absolute top-0 left-0 w-full h-1.5 bg-brandGreen"></div>
      <h3 id="alertTitle" class="text-xl font-extrabold mb-2 mt-2 text-slate-900">Notice</h3>
      <p id="alertMessage" class="text-sm text-slate-600 mb-6 break-words">Message</p>
      <button onclick="closeAlert()" class="w-full bg-brandGreen text-white py-3 rounded-xl font-bold shadow-sm cursor-pointer hover:bg-brandGreenDark transition active:scale-95 mt-2">Got it</button>
    </div>
  </div>

  <button type="button" class="fixed bottom-20 sm:bottom-8 right-4 sm:right-8 bg-black text-white p-4 rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-transform z-40 flex items-center gap-2 cursor-pointer" onclick="showAlert('OgaMarket Concierge', 'Our market concierge line is active on WhatsApp: +234 800 OGAMARKET')">
    <svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
    <span class="font-bold text-sm hidden sm:inline-block pointer-events-none">Chat with us</span>
  </button>

  <script>
    const supabaseUrl = 'https://pbrrysybqwsqdxuuedci.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBicnJ5c3licXdzcWR4dXVlZGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MzkwOTEsImV4cCI6MjEwOTExNTA5MX0.laJXb1cFo9uiZGydu4_eUCSGzecIkV6RZFmElm21KWM';
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    let catalog = [];
    let cart = JSON.parse(localStorage.getItem('ogamarket_cart')) || [];
    let currentCategory = 'ALL';
    let detailsIdOpened = null;
    let pendingCartActionId = null; // Holds item ID if user was interrupted by lead capture

    function showAlert(title, message, isError = false) {
      document.getElementById('alertTitle').innerText = title;
      document.getElementById('alertMessage').innerText = message;
      document.getElementById('alertTopBar').className = 'absolute top-0 left-0 w-full h-1.5 ' + (isError ? 'bg-brandRed' : 'bg-brandGreen');
      document.getElementById('customAlert').classList.remove('hidden');
      document.getElementById('customAlert').classList.add('flex');
    }
    function closeAlert() { document.getElementById('customAlert').classList.add('hidden'); document.getElementById('customAlert').classList.remove('flex'); }

    async function init() {
      await fetchProducts();
      updateCartUI();
      
      // Pre-fill checkout form if we know the user
      const knownEmail = localStorage.getItem('oga_user_email');
      const knownName = localStorage.getItem('oga_user_name');
      if(knownEmail) document.getElementById('custEmail').value = knownEmail;
      if(knownName) document.getElementById('custName').value = knownName;
    }

    async function fetchProducts() {
      const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });
      document.getElementById('loader').classList.add('hidden');
      if (error) {
        document.getElementById('productGrid').innerHTML = '<p class="col-span-full text-center text-brandRed font-bold py-10">Failed to load inventory.</p>';
      } else {
        catalog = data || [];
        if (catalog.length === 0) {
          document.getElementById('productGrid').innerHTML = '<p class="col-span-full text-center text-slate-500 py-10">Store is currently empty. Check back later!</p>';
        } else {
          renderProducts();
        }
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const filtered = catalog.filter(item => currentCategory === 'ALL' || item.category === currentCategory);
      
      grid.innerHTML = filtered.map(item => {
        const cartItem = cart.find(c => String(c.id) === String(item.id));
        const qty = cartItem ? cartItem.quantity : 0;
        
        let btnHtml = '';
        if(qty > 0) {
          btnHtml = `
            <div class="flex items-center justify-between bg-brandGreen text-white rounded-lg overflow-hidden shadow-sm h-9 sm:h-10">
              <button type="button" onclick="updateQuantity('${item.id}', -1, event)" class="w-10 h-full font-bold hover:bg-brandGreenDark transition active:scale-95">-</button>
              <span class="font-bold text-sm pointer-events-none">${qty}</span>
              <button type="button" onclick="updateQuantity('${item.id}', 1, event)" class="w-10 h-full font-bold hover:bg-brandGreenDark transition active:scale-95">+</button>
            </div>
          `;
        } else {
          btnHtml = `<button type="button" onclick="triggerAddToCart('${item.id}', event)" class="w-full bg-brandGreen text-white py-2 sm:py-2.5 rounded-lg font-bold text-xs sm:text-sm active:scale-95 transition cursor-pointer flex items-center justify-center gap-1.5 h-9 sm:h-10">Add to Bag</button>`;
        }

        return `
        <div class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between shadow-sm bg-white cursor-pointer hover:shadow-md transition" onclick="openDetails('${item.id}')">
          <img src="${item.image}" class="h-32 sm:h-48 w-full object-cover pointer-events-none"/>
          <div class="p-3 sm:p-4 pointer-events-none">
            <h3 class="font-bold text-xs sm:text-sm text-slate-900 leading-tight mb-1 truncate">${item.name}</h3>
            <p class="text-[10px] sm:text-xs text-slate-500 mb-2 truncate">${item.gauge}</p>
            <p class="text-sm sm:text-lg font-extrabold font-mono text-brandGreen">&#8358;${Number(item.price).toLocaleString()}</p>
          </div>
          <div class="p-3 pt-0">
            ${btnHtml}
          </div>
        </div>`;
      }).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-tab').forEach(btn => {
        btn.classList.remove('bg-brandGreen', 'text-white');
        btn.classList.add('bg-white', 'text-slate-600');
      });
      document.getElementById('tab-' + cat).classList.add('bg-brandGreen', 'text-white');
      document.getElementById('tab-' + cat).classList.remove('bg-white', 'text-slate-600');
      renderProducts();
    }

    // LEAD CAPTURE LOGIC
    function triggerAddToCart(id, e) {
      if(e) e.stopPropagation();
      const isKnown = localStorage.getItem('oga_user_email');
      const skippedDiscount = sessionStorage.getItem('oga_skipped_discount');
      
      if(!isKnown && !skippedDiscount) {
        // Show discount modal instead of adding immediately
        pendingCartActionId = id;
        document.getElementById('discountModal').classList.remove('hidden');
        document.getElementById('discountModal').classList.add('flex');
      } else {
        executeAddToCart(id);
      }
    }

    async function handleDiscountSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('leadName').value.trim();
      const email = document.getElementById('leadEmail').value.trim().toLowerCase();
      
      // Save locally
      localStorage.setItem('oga_user_name', name);
      localStorage.setItem('oga_user_email', email);
      
      // Push to CRM quietly in background (won't block UI if slow)
      db.from('customers').upsert([{ email: email, first_name: name }]).then();
      
      document.getElementById('discountModal').classList.add('hidden');
      document.getElementById('discountModal').classList.remove('flex');
      
      showAlert("Discount Unlocked! 🎉", "Welcome to OgaMarket! Use code OGA500 at checkout.");
      
      // Resume adding the item they initially clicked
      if(pendingCartActionId) {
        executeAddToCart(pendingCartActionId);
        pendingCartActionId = null;
      }
    }

    function skipDiscount() {
      sessionStorage.setItem('oga_skipped_discount', 'true');
      document.getElementById('discountModal').classList.add('hidden');
      document.getElementById('discountModal').classList.remove('flex');
      
      if(pendingCartActionId) {
        executeAddToCart(pendingCartActionId);
        pendingCartActionId = null;
      }
    }

    // ACTUAL CART LOGIC
    function executeAddToCart(id) {
      const item = catalog.find(p => String(p.id) === String(id));
      if (!item) return;
      const existing = cart.find(c => String(c.id) === String(id));
      if (existing) existing.quantity += 1; else cart.push({ ...item, quantity: 1 });
      
      saveCart(); updateCartUI(); renderProducts(); refreshDetailsButton();
      syncAbandonedCart(); // Sync to CRM
      
      const badge = document.getElementById('cartCountBadge');
      badge.classList.remove('badge-pop'); void badge.offsetWidth; badge.classList.add('badge-pop');
    }

    function updateQuantity(id, delta, e) {
      if(e) e.stopPropagation();
      const index = cart.findIndex(c => String(c.id) === String(id));
      if (index > -1) {
        cart[index].quantity += delta;
        if (cart[index].quantity <= 0) cart.splice(index, 1);
      }
      saveCart(); updateCartUI(); renderProducts(); refreshDetailsButton();
      syncAbandonedCart(); // Sync to CRM
    }

    // ABANDONED CART TRACKER
    async function syncAbandonedCart() {
      const email = localStorage.getItem('oga_user_email');
      if(!email) return; // Can't track anonymous users
      
      // Wipe old cart for this email, save current status
      await db.from('abandoned_carts').delete().eq('email', email);
      if(cart.length > 0) {
        await db.from('abandoned_carts').insert([{ email: email, cart_data: cart }]);
      }
    }

    function saveCart() { localStorage.setItem('ogamarket_cart', JSON.stringify(cart)); }

    function updateCartUI() {
      document.getElementById('cartCountBadge').innerText = cart.reduce((acc, cur) => acc + (cur.quantity || 1), 0);
      const container = document.getElementById('cartItemsContainer');
      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400"><p class="text-sm">Your shopping bag is empty.</p></div>`;
        document.getElementById('checkoutTriggerBtn').disabled = true;
        document.getElementById('checkoutTriggerBtn').classList.add('opacity-50', 'pointer-events-none');
      } else {
        container.innerHTML = cart.map(item => `
          <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0 gap-3">
            <div class="flex items-center gap-3 flex-1 cursor-pointer hover:bg-slate-50 p-1 -ml-1 rounded-lg transition" onclick="closeCart(); openDetails('${item.id}');">
              <img src="${item.image}" alt="${item.name}" class="w-12 h-12 sm:w-14 sm:h-14 rounded-lg object-cover border border-slate-200 flex-shrink-0" />
              <div>
                <p class="font-bold text-sm text-slate-900 line-clamp-1">${item.name}</p>
                <p class="text-[11px] text-slate-500">${item.gauge}</p>
                <p class="text-xs font-mono text-brandGreen font-bold mt-0.5">&#8358;${Number(item.price).toLocaleString()}</p>
              </div>
            </div>
            <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg flex-shrink-0">
              <button type="button" onclick="updateQuantity('${item.id}', -1, event)" class="w-7 h-7 bg-white rounded font-bold shadow-sm active:bg-slate-50 cursor-pointer">-</button>
              <span class="font-mono text-sm font-bold w-4 text-center">${item.quantity}</span>
              <button type="button" onclick="updateQuantity('${item.id}', 1, event)" class="w-7 h-7 bg-white rounded font-bold shadow-sm active:bg-slate-50 cursor-pointer">+</button>
            </div>
          </div>
        `).join('');
        document.getElementById('checkoutTriggerBtn').disabled = false;
        document.getElementById('checkoutTriggerBtn').classList.remove('opacity-50', 'pointer-events-none');
      }
      const subtotal = cart.reduce((acc, cur) => acc + (cur.price * cur.quantity), 0);
      document.getElementById('cartSubtotalText').innerHTML = '&#8358;' + subtotal.toLocaleString();
    }

    // DETAILS MODAL
    function openDetails(id) {
      const item = catalog.find(p => String(p.id) === String(id));
      if(!item) return;
      detailsIdOpened = id;
      
      const imagesContainer = document.getElementById('detailsImages');
      let allImages = [item.image];
      if(item.extra_images && Array.isArray(item.extra_images)) {
        allImages = allImages.concat(item.extra_images);
      }
      imagesContainer.innerHTML = allImages.map(img => `<img src="${img}" class="h-48 w-4/5 object-cover rounded-xl snap-center flex-shrink-0" />`).join('');
      
      document.getElementById('detailsName').innerText = item.name;
      document.getElementById('detailsGauge').innerText = item.gauge;
      document.getElementById('detailsPrice').innerHTML = '&#8358;' + Number(item.price).toLocaleString();
      document.getElementById('detailsDesc').innerText = item.description || "No description provided.";
      
      refreshDetailsButton();
      
      document.getElementById('detailsModal').classList.remove('hidden');
      document.getElementById('detailsModal').classList.add('flex');
    }

    function refreshDetailsButton() {
      if(!detailsIdOpened) return;
      const cartItem = cart.find(c => String(c.id) === String(detailsIdOpened));
      const qty = cartItem ? cartItem.quantity : 0;
      
      let btnHtml = '';
      if(qty > 0) {
        btnHtml = `
          <div class="flex items-center justify-between bg-brandGreen text-white rounded-xl overflow-hidden shadow-sm h-12 w-full">
            <button type="button" onclick="updateQuantity('${detailsIdOpened}', -1, event)" class="w-16 h-full font-bold hover:bg-brandGreenDark transition active:scale-95 text-lg">-</button>
            <span class="font-bold text-base pointer-events-none">${qty} in Bag</span>
            <button type="button" onclick="updateQuantity('${detailsIdOpened}', 1, event)" class="w-16 h-full font-bold hover:bg-brandGreenDark transition active:scale-95 text-lg">+</button>
          </div>
        `;
      } else {
        btnHtml = `<button type="button" onclick="triggerAddToCart('${detailsIdOpened}', event)" class="w-full bg-brandGreen text-white py-3.5 rounded-xl font-bold active:scale-95 transition cursor-pointer">Add to Bag</button>`;
      }
      document.getElementById('detailsActionBtn').innerHTML = btnHtml;
    }

    function closeDetails() { document.getElementById('detailsModal').classList.add('hidden'); document.getElementById('detailsModal').classList.remove('flex'); detailsIdOpened = null; }
    function openCart() { document.getElementById('cartModal').classList.remove('hidden'); }
    function closeCart() { document.getElementById('cartModal').classList.add('hidden'); }
    
    function openCheckout() { 
      closeCart(); 
      // Update form dynamically if they unlocked a discount
      const knownEmail = localStorage.getItem('oga_user_email');
      const knownName = localStorage.getItem('oga_user_name');
      if(knownEmail) document.getElementById('custEmail').value = knownEmail;
      if(knownName) document.getElementById('custName').value = knownName;
      
      document.getElementById('checkoutModal').classList.remove('hidden'); 
      document.getElementById('checkoutModal').classList.add('flex'); 
    }
    
    function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); document.getElementById('checkoutModal').classList.remove('flex'); }

    async function handleCheckout(e) {
      e.preventDefault();
      const btn = document.getElementById('submitOrderBtn');
      btn.innerText = "Processing...";
      btn.disabled = true;

      const email = document.getElementById('custEmail').value.trim().toLowerCase();
      const name = document.getElementById('custName').value.trim();
      
      // Update CRM with final checkout details if anonymous until now
      if(!localStorage.getItem('oga_user_email')) {
        localStorage.setItem('oga_user_email', email);
        localStorage.setItem('oga_user_name', name);
        db.from('customers').upsert([{ email: email, first_name: name }]).then();
      }
      
      const newOrder = {
        order_ref: '#OGA-' + Math.floor(10000 + Math.random() * 90000),
        email: email,
        customer_name: name,
        whatsapp: document.getElementById('custWhatsApp').value,
        destination: document.getElementById('custDestination').value,
        delivery_address: document.getElementById('custAddress').value,
        items: cart,
        status: 'Sourcing in Market'
      };

      const { error } = await db.from('orders').insert([newOrder]);

      if (error) {
        showAlert("Checkout failed", error.message, true);
        btn.innerText = "Submit Order";
        btn.disabled = false;
        return;
      }
      
      // Clear abandoned cart on successful checkout
      await db.from('abandoned_carts').delete().eq('email', email);

      cart = []; saveCart(); updateCartUI(); renderProducts(); closeCheckout();
      window.location.href = "track.html?email=" + encodeURIComponent(email);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
