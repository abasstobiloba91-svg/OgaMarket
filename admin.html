<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>OgaMarket | Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandGreen: '#085A36', brandGold: '#F2A900', surfaceBg: '#F0F4F2' },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], body: ['"Inter"', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    input, select, textarea, button { font-size: 16px !important; }
    .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.9); }
    .glass-panel { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 24px 0 rgba(8, 90, 54, 0.05); }
    .bg-blob-1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(8,90,54,0.15) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; z-index: -1; }
  </style>
</head>
<body class="bg-surfaceBg text-slate-800 p-4 sm:p-8 font-sans min-h-screen pb-24 sm:pb-8">
  <div class="bg-blob-1"></div>
  
  <div class="max-w-4xl mx-auto glass-panel p-5 sm:p-8 rounded-3xl">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4 border-b border-slate-200/60 pb-5">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-brandGreen">Staff Operations</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Live Database</p>
      </div>
      <div class="hidden sm:flex gap-3">
        <a href="index.html" class="text-xs bg-white border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded-xl font-bold transition">Home</a>
        <a href="store.html" class="text-xs bg-white border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded-xl font-bold transition">Store</a>
      </div>
    </div>

    <div class="mb-8">
      <h2 class="font-extrabold text-sm uppercase tracking-wider text-slate-600 mb-3">Today's Orders</h2>
      <div class="bg-white/80 rounded-2xl p-4 border border-white shadow-sm space-y-3">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center py-2 border-b border-slate-100 last:border-0 gap-2">
          <div><p class="font-bold text-sm">#OGA-99104 - Bolanle Adeyemi</p><p class="text-xs text-slate-500 mt-1">2x White Ijebu Garri</p></div>
          <span class="bg-amber-100 border border-amber-200 text-amber-800 font-bold text-[10px] uppercase tracking-wider px-3 py-1.5 rounded-full w-max">Market Sourcing</span>
        </div>
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center py-2 border-b border-slate-100 last:border-0 gap-2">
          <div><p class="font-bold text-sm">#OGA-99105 - Emeka Okoro</p><p class="text-xs text-slate-500 mt-1">3x Heavy Benue Yam</p></div>
          <span class="bg-brandGreen border border-brandGreenDark text-white font-bold text-[10px] uppercase tracking-wider px-3 py-1.5 rounded-full w-max">Dispatched</span>
        </div>
      </div>
    </div>

    <div id="inventory">
      <h2 class="font-extrabold text-sm uppercase tracking-wider text-slate-600 mb-3">Live Prices (₦)</h2>
      <ul id="adminInv" class="bg-white/80 rounded-2xl p-4 border border-white shadow-sm divide-y divide-slate-100 space-y-2"></ul>
    </div>
  </div>

  <nav class="sm:hidden fixed bottom-0 left-0 w-full glass-nav z-50 flex items-center justify-around pb-safe pt-2 px-2 h-16 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
    <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-brandGreen p-2 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="store.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-brandGreen p-2 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <span class="text-[10px] font-bold">Store</span>
    </a>
    <a href="admin.html" class="flex flex-col items-center gap-1 text-brandGreen p-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      <span class="text-[10px] font-bold">Admin</span>
    </a>
  </nav>

  <script>
    const catalog = JSON.parse(localStorage.getItem('ogamarket_catalog')) || [];
    
    function renderAdminInventory() {
      const container = document.getElementById('adminInv');
      if (catalog.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-500 py-2">No items in store.</p>';
        return;
      }
      container.innerHTML = catalog.map(i => `
        <li class="flex flex-col sm:flex-row sm:items-center justify-between py-3 gap-3">
          <div class="flex items-center gap-3">
            <img src="${i.image}" class="w-10 h-10 rounded-lg object-cover border border-slate-200" />
            <div>
              <span class="font-bold text-xs sm:text-sm block text-slate-900">${i.name}</span>
              <span class="text-[10px] text-slate-500 font-medium">${i.gauge}</span>
            </div>
          </div>
          <div class="flex items-center gap-2 bg-slate-50 p-1.5 rounded-lg border border-slate-200 w-max">
            <span class="text-xs font-bold text-slate-400 pl-1">₦</span>
            <input type="number" value="${i.price}" onchange="updatePrice('${i.id}', this.value)" class="w-20 bg-transparent font-mono text-sm font-bold text-brandGreen focus:outline-none"/>
          </div>
        </li>
      `).join('');
    }

    function updatePrice(id, newPrice) {
      const idx = catalog.findIndex(p => p.id === id);
      if (idx !== -1) {
        catalog[idx].price = Number(newPrice);
        localStorage.setItem('ogamarket_catalog', JSON.stringify(catalog));
      }
    }

    window.addEventListener('DOMContentLoaded', renderAdminInventory);
  </script>
</body>
</html>
