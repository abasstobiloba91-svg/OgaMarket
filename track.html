<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OgaMarket — Track Your Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F8FAF9] text-gray-900 min-h-screen flex flex-col font-sans">

  <!-- Navigation -->
  <nav class="bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="text-2xl font-black text-[#085A36] tracking-tight">Oga<span class="text-[#F2A900]">Market</span></span>
      </a>
      <div class="flex items-center gap-6">
        <a href="/" class="text-sm font-semibold text-gray-600 hover:text-[#085A36] transition">Home</a>
        <a href="store" class="text-sm font-semibold text-gray-600 hover:text-[#085A36] transition">Market Store</a>
        <a href="track" class="text-sm font-semibold text-[#085A36]">Track Order</a>
      </div>
    </div>
  </nav>

  <!-- Tracker Engine -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12 flex-1 w-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-gray-900">Track Your Market Order</h1>
      <p class="text-sm text-gray-500 mt-2">Check the real-time preparation and dispatch state of your delivery.</p>
    </div>

    <!-- Search Box -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 flex gap-2 mb-8">
      <input type="email" id="trackEmailInput" placeholder="Enter the email address used at checkout" class="w-full px-4 py-2 text-sm outline-none" />
      <button onclick="handleTrackSearch()" class="bg-[#085A36] text-white text-sm font-bold px-6 py-2.5 rounded-xl hover:bg-[#07472b] transition">
        Track
      </button>
    </div>

    <!-- Results Box -->
    <div id="trackingResultArea" class="space-y-4">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <footer class="bg-white border-t border-gray-100 py-6 text-center text-xs text-gray-500">
    <p class="font-bold text-[#085A36]">Shopping like the Oga!</p>
    <p class="mt-1">© 2026 OgaMarket. All rights reserved.</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const email = params.get("email");
      if (email) {
        document.getElementById("trackEmailInput").value = email;
        fetchOrderTracking(email);
      }
    });

    function handleTrackSearch() {
      const email = document.getElementById("trackEmailInput").value.trim();
      if (!email) {
        alert("Please enter your email.");
        return;
      }
      fetchOrderTracking(email);
    }

    async function fetchOrderTracking(email) {
      const container = document.getElementById("trackingResultArea");
      container.innerHTML = `<p class="text-center py-8 text-gray-400 text-sm">Locating market orders...</p>`;

      const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*")
        .ilike("email", email)
        .order("created_at", { ascending: false });

      if (error || !orders || orders.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-gray-200">
            <p class="text-gray-500 text-sm">No orders found for <strong>${email}</strong>.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
          <div class="flex items-center justify-between border-b border-gray-100 pb-4 mb-4">
            <div>
              <span class="text-xs font-bold text-gray-400 uppercase">Order Reference</span>
              <h3 class="text-lg font-black text-gray-900">${o.order_ref}</h3>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-bold ${o.status === 'Dispatched' ? 'bg-emerald-100 text-[#085A36]' : 'bg-amber-100 text-amber-800'}">
              ${o.status}
            </span>
          </div>

          <div class="space-y-2 text-sm text-gray-600 mb-4">
            <p><strong>Customer:</strong> ${o.customer_name}</p>
            <p><strong>Delivery Method:</strong> ${o.destination === 'lagos' ? 'Lagos Doorstep Dispatch' : 'Interstate Motor Park Waybill'}</p>
            <p><strong>Destination:</strong> ${o.delivery_address}</p>
            ${o.payment_status ? `<p><strong>Payment Status:</strong> <span class="text-emerald-700 font-bold">${o.payment_status}</span></p>` : ''}
          </div>

          <div class="bg-gray-50 p-4 rounded-xl text-xs text-gray-500">
            <p class="font-bold text-gray-700 mb-1">Status Overview:</p>
            <p>${o.status === 'Dispatched' ? 'Your package has left the market floor and is on its way with the dispatch agent.' : 'Our agents are currently handpicking your order from fresh morning stocks.'}</p>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
